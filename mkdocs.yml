site_name: aerosolprops
site_description: Structure-derived pure-component properties for atmospheric organic aerosol
repo_url: https://github.com/openEarthModelling/aerosolprops
theme:
  name: material
  features:
    - navigation.sections
markdown_extensions:
  - admonition
  - toc:
      permalink: true
nav:
  - index.md
  - Methods:
      - SIMPOL.1: methods/simpol1.md
      - EVAPORATION: methods/evaporation.md
      - Nannoolal (Part 1 + Part 3): methods/nannoolal.md
      - Myrdal–Yalkowsky: methods/myrdal_yalkowsky.md
  - LICENSE: license.md
strict: true
